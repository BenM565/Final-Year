{% extends "base.html" %}
{% block title %}Edit task · STEP{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="page-header animate-in">
      <h2 class="mb-1">Edit <span class="text-gradient">task</span></h2>
      <p class="subtitle mb-0">Update the details — changes are visible to students immediately.</p>
    </div>

    <div class="card animate-in delay-1">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
              <input name="title" class="form-control" value="{{ task.title }}" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Requirements</label>
            <textarea name="requirements" class="form-control" rows="5">{{ task.requirements or '' }}</textarea>
          </div>

          <div class="mb-4">
            <label class="form-label">Estimated hours</label>
            <div class="input-group" style="max-width: 220px;">
              <span class="input-group-text"><i class="bi bi-clock"></i></span>
              <input name="estimated_hours" type="number" min="1" class="form-control" value="{{ task.estimated_hours or '' }}">
            </div>
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>Save changes</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>

    <div class="card mt-4 animate-in delay-2" style="border-color: rgba(239, 68, 68, .35);">
      <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
          <div class="fw-semibold text-danger"><i class="bi bi-exclamation-triangle me-2"></i>Danger zone</div>
          <div class="small text-secondary">Deleting a task also removes all of its applications.</div>
        </div>
        <form method="post" action="{{ url_for('delete_task', task_id=task.id) }}"
              onsubmit="return confirm('Delete this task? This cannot be undone.');">
          <button class="btn btn-outline-danger"><i class="bi bi-trash me-1"></i>Delete task</button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
