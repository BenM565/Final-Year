{% extends "base.html" %}
{% block title %}Post a task · STEP{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="page-header animate-in">
      <h2 class="mb-1">Post a <span class="text-gradient">new task</span></h2>
      <p class="subtitle mb-0">Describe the work and students can start applying right away.</p>
    </div>

    <div class="card animate-in delay-1">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
              <input name="title" required class="form-control" placeholder="e.g., Build a login page with Bootstrap">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Requirements</label>
            <textarea name="requirements" rows="5" class="form-control"
                      placeholder="Skills required, deliverables, acceptance criteria…"></textarea>
            <div class="form-text">The clearer the requirements, the better the applications.</div>
          </div>

          <div class="mb-4">
            <label class="form-label">Estimated hours</label>
            <div class="input-group" style="max-width: 220px;">
              <span class="input-group-text"><i class="bi bi-clock"></i></span>
              <input name="estimated_hours" type="number" min="1" class="form-control" placeholder="e.g., 12">
            </div>
          </div>

          <div class="d-flex gap-2">
            <button class="btn btn-primary px-4"><i class="bi bi-plus-lg me-1"></i>Create task</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
